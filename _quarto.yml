project:
  type: book
  output-dir: _book
  resources:
    - datos
    - webr
    - webr-repo
    - plantillas
    - pdf
    - moodle
    - sw.js

book:
  title: "Competencias digitales para el uso de la información"
  subtitle: "Guía interactiva para el Grado en Gestión de la Información y Contenidos Digitales"
  author:
    - name: "Pablo Sánchez-Núñez"
      orcid: 0000-0001-7845-9506
      url: https://pablosancheznunez.com
      affiliation: "Universidad Carlos III de Madrid"
  date: last-modified
  date-format: "D [de] MMMM [de] YYYY"
  language: es
  site-url: https://pablosancheznunez.com/competencias-informacion/
  doi: 10.5281/zenodo.24515144
  search: true
  page-navigation: true
  sidebar:
    tools:
      - icon: download
        menu:
          - text: "Libro en PDF"
            href: pdf/competencias-informacion.pdf
          - text: "Libro en EPUB (lectores de libros electrónicos)"
            href: pdf/competencias-informacion.epub
  page-footer:
    left: "© 2026 [Pablo Sánchez-Núñez](https://pablosancheznunez.com) · [ORCID 0000-0001-7845-9506](https://orcid.org/0000-0001-7845-9506) · Texto bajo licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es)"
    right: "Universidad Carlos III de Madrid · Hecho con [Quarto](https://quarto.org) y [webR](https://docs.r-wasm.org/webr/latest/)"
  chapters:
    - index.qmd
    - 00-r-en-el-libro.qmd
    - part: "Unidades"
      chapters:
        - 01-fuentes.qmd
        - 02-recuperacion.qmd
        - 03-etica-plagio.qmd
        - 04-referencias.qmd
        - 05-ia-fundamentos.qmd
        - 06-ia-etica.qmd
  appendices:
    - 90-citas.qmd
    - 91-guia-docente.qmd
    - 92-glosario.qmd

lang: es

crossref:
  chapters: false

filters:
  - webex

format:
  live-html:
    theme:
      light: [cosmo, estilos.scss]
      dark: [darkly, estilos-oscuro.scss]
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    link-external-newwindow: true
    callout-appearance: simple
    include-after-body:
      - accesibilidad.html
      - progreso.html

webr:
  engine-url: webr/
  repos:
    - webr-repo
  resources:
    - datos
